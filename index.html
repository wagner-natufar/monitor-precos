<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitor de Preços</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  /* ================ THEME VARIABLES ================ */
  :root {
    --bg: #f7faf7;
    --surface: #ffffff;
    --surface-2: #f0fdf4;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-soft: #94a3b8;
    --border: #e5e7eb;
    --border-light: #f1f5f9;
    --primary: #16a34a;
    --primary-hover: #15803d;
    --primary-soft: #dcfce7;
    --primary-text-on: #ffffff;
    --sidebar-bg: #14532d;
    --sidebar-text: #ffffff;
    --sidebar-text-muted: #bbf7d0;
    --sidebar-border: #166534;
    --sidebar-hover: #166534;
    --sidebar-active: #16a34a;
    --topbar-bg: #ffffff;
    --topbar-border: #e5e7eb;
    --input-bg: #ffffff;
    --input-border: #d1d5db;
    --input-focus: #16a34a;
    --row-hover: #f0fdf4;
    --row-detail: #f7faf7;
    --thead-bg: #f0fdf4;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 25px 60px rgba(0,0,0,0.25);
    --modal-overlay: rgba(0,0,0,0.5);
    --success-bg: #dcfce7;
    --success-text: #065f46;
    --error-bg: #fee2e2;
    --error-text: #b91c1c;
    --secondary-bg: #e5e7eb;
    --secondary-text: #374151;
    --secondary-hover: #d1d5db;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --danger-hover: #fee2e2;
    --variation-up: #16a34a;
    --variation-down: #dc2626;
    --auth-gradient: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
  }

  [data-theme="dark"] {
    --bg: #0a0f0c;
    --surface: #14201a;
    --surface-2: #0f1a14;
    --text: #f0fdf4;
    --text-muted: #94a3b8;
    --text-soft: #64748b;
    --border: #1f3a2b;
    --border-light: #1a2e22;
    --primary: #22c55e;
    --primary-hover: #16a34a;
    --primary-soft: rgba(34,197,94,0.15);
    --primary-text-on: #0a0f0c;
    --sidebar-bg: #050a07;
    --sidebar-text: #f0fdf4;
    --sidebar-text-muted: #4ade80;
    --sidebar-border: #14201a;
    --sidebar-hover: #14201a;
    --sidebar-active: #16a34a;
    --topbar-bg: #14201a;
    --topbar-border: #1f3a2b;
    --input-bg: #0f1a14;
    --input-border: #1f3a2b;
    --input-focus: #22c55e;
    --row-hover: #1a2e22;
    --row-detail: #0f1a14;
    --thead-bg: #0f1a14;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-lg: 0 25px 60px rgba(0,0,0,0.6);
    --modal-overlay: rgba(0,0,0,0.7);
    --success-bg: rgba(34,197,94,0.18);
    --success-text: #4ade80;
    --error-bg: rgba(239,68,68,0.15);
    --error-text: #f87171;
    --secondary-bg: #1f3a2b;
    --secondary-text: #f0fdf4;
    --secondary-hover: #2d4a3a;
    --danger-bg: rgba(239,68,68,0.12);
    --danger-text: #f87171;
    --danger-hover: rgba(239,68,68,0.2);
    --variation-up: #4ade80;
    --variation-down: #f87171;
    --auth-gradient: linear-gradient(135deg, #050a07 0%, #14532d 100%);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); transition: background 0.2s, color 0.2s; }
  button { cursor: pointer; border: none; background: none; font-size: inherit; color: inherit; }
  input, select { font-size: inherit; font-family: inherit; }

  /* ================= AUTH ================= */
  .auth-bg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             background: var(--auth-gradient); }
  .auth-card { background: var(--surface); padding: 40px; border-radius: 16px; width: 100%; max-width: 420px;
               box-shadow: var(--shadow-lg); }
  .auth-card h1 { text-align: center; margin-bottom: 8px; color: var(--primary); font-size: 28px; }
  .auth-card .sub { text-align: center; color: var(--text-muted); margin-bottom: 28px; font-size: 14px; }
  .auth-card label { display: block; margin: 14px 0 6px; font-size: 13px; color: var(--text); font-weight: 500; }
  .auth-card input { width: 100%; padding: 12px; border: 1px solid var(--input-border); border-radius: 8px;
                     font-size: 15px; background: var(--input-bg); color: var(--text); }
  .auth-card input:focus { outline: none; border-color: var(--input-focus); }
  .auth-card .btn-primary { width: 100%; margin-top: 22px; background: var(--primary); color: var(--primary-text-on);
                            padding: 12px; border-radius: 8px; font-weight: 600; font-size: 15px; }
  .auth-card .btn-primary:hover { background: var(--primary-hover); }
  .auth-card .switch { text-align: center; margin-top: 18px; color: var(--text-muted); font-size: 14px; }
  .auth-card .switch a { color: var(--primary); font-weight: 600; cursor: pointer; }
  .auth-card .msg { padding: 12px; border-radius: 8px; margin-top: 14px; font-size: 14px; text-align: center; }
  .auth-card .msg.error { background: var(--error-bg); color: var(--error-text); }
  .auth-card .msg.success { background: var(--success-bg); color: var(--success-text); }

  /* ================= APP LAYOUT ================= */
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* Sidebar fixa */
  .sidebar { background: var(--sidebar-bg); color: var(--sidebar-text); width: 240px; flex-shrink: 0;
             display: flex; flex-direction: column; height: 100vh;
             transition: width 0.25s ease; overflow: hidden; }
  .sidebar.collapsed { width: 64px; }
  .sidebar .logo { padding: 18px 20px; display: flex; align-items: center; gap: 10px;
                   font-size: 18px; font-weight: 700; border-bottom: 1px solid var(--sidebar-border);
                   white-space: nowrap; }
  .sidebar .logo .icon { font-size: 22px; }
  .sidebar .toggle { padding: 12px 20px; color: var(--sidebar-text-muted);
                     display: flex; align-items: center; gap: 10px; font-size: 14px; }
  .sidebar .toggle:hover { color: var(--sidebar-text); }
  .sidebar nav { flex: 1; padding: 12px 0; overflow-y: auto; }
  .sidebar nav button { display: flex; align-items: center; gap: 12px; width: 100%;
                        padding: 12px 20px; color: var(--sidebar-text); text-align: left; white-space: nowrap;
                        position: relative; opacity: 0.85; }
  .sidebar nav button:hover { background: var(--sidebar-hover); opacity: 1; }
  .sidebar nav button.active { background: var(--sidebar-active); opacity: 1; }
  .sidebar nav button .icon { font-size: 18px; min-width: 22px; text-align: center; }
  .sidebar nav button .badge { background: #ef4444; color: #fff; font-size: 11px;
                               border-radius: 10px; padding: 2px 7px; margin-left: auto; }
  .sidebar.collapsed .label,
  .sidebar.collapsed .logo span:not(.icon),
  .sidebar.collapsed .toggle span:not(.toggle-icon),
  .sidebar.collapsed .badge { display: none; }
  .sidebar .user-block { padding: 14px 20px; border-top: 1px solid var(--sidebar-border); font-size: 13px; }
  .sidebar .user-block .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sidebar .user-block .role { color: var(--sidebar-text-muted); font-size: 11px; text-transform: uppercase; margin-top: 2px; }
  .sidebar .user-block .logout { margin-top: 10px; color: #fca5a5; font-size: 13px; }
  .sidebar.collapsed .user-block .name,
  .sidebar.collapsed .user-block .role { display: none; }

  /* Theme toggle */
  .theme-toggle { padding: 10px 20px; display: flex; align-items: center; gap: 10px; color: var(--sidebar-text-muted);
                  font-size: 13px; border-top: 1px solid var(--sidebar-border); }
  .theme-toggle:hover { color: var(--sidebar-text); background: var(--sidebar-hover); }
  .theme-toggle .icon { font-size: 16px; min-width: 22px; text-align: center; }
  .sidebar.collapsed .theme-toggle .label { display: none; }

  /* Main content area com scroll independente */
  .main { flex: 1; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  .topbar { background: var(--topbar-bg); padding: 18px 30px; border-bottom: 1px solid var(--topbar-border);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .topbar h2 { font-size: 22px; color: var(--text); }
  .topbar .search { position: relative; }
  .topbar .search input { padding: 10px 14px 10px 38px; border: 1px solid var(--input-border);
                          border-radius: 8px; width: 320px; font-size: 14px;
                          background: var(--input-bg); color: var(--text); }
  .topbar .search input:focus { outline: none; border-color: var(--input-focus); }
  .topbar .search .icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--text-soft); }

  .content { flex: 1; overflow-y: auto; padding: 24px 30px; }

  /* Stats cards */
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border-radius: 12px; padding: 20px;
               box-shadow: var(--shadow); border: 1px solid var(--border-light); }
  .stat-card .label { color: var(--text-muted); font-size: 13px; margin-bottom: 6px; }
  .stat-card .value { font-size: 26px; font-weight: 700; color: var(--primary); }
  .stat-card .sub { color: var(--text-soft); font-size: 12px; margin-top: 4px; }

  /* Table card */
  .table-card { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow);
                border: 1px solid var(--border-light);
                display: flex; flex-direction: column; overflow: hidden; max-height: calc(100vh - 290px); }
  .table-header { padding: 18px 20px; border-bottom: 1px solid var(--border);
                  display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .table-header h3 { font-size: 16px; color: var(--text); }
  .btn-primary { background: var(--primary); color: var(--primary-text-on); padding: 9px 18px; border-radius: 8px; font-weight: 600; font-size: 14px; }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-secondary { background: var(--secondary-bg); color: var(--secondary-text); padding: 9px 16px; border-radius: 8px; font-size: 14px; }
  .btn-secondary:hover { background: var(--secondary-hover); }
  .btn-danger { background: var(--danger-bg); color: var(--danger-text); padding: 6px 12px; border-radius: 6px; font-size: 12px; }
  .btn-danger:hover { background: var(--danger-hover); }
  .btn-edit { background: var(--primary-soft); color: var(--primary); padding: 6px 12px; border-radius: 6px; font-size: 12px; margin-right: 6px; }
  .btn-edit:hover { background: var(--primary); color: var(--primary-text-on); }

  /* SCROLL INDEPENDENTE da tabela */
  .table-scroll { flex: 1; overflow-y: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead th { position: sticky; top: 0; background: var(--thead-bg); padding: 12px 20px;
             text-align: left; font-size: 12px; color: var(--text-muted); text-transform: uppercase;
             font-weight: 600; border-bottom: 1px solid var(--border); z-index: 1; }
  tbody td { padding: 14px 20px; border-bottom: 1px solid var(--border-light); font-size: 14px; color: var(--text); }
  tbody tr.row-main { cursor: pointer; transition: background 0.1s; }
  tbody tr.row-main:hover { background: var(--row-hover); }
  tbody tr.row-main.expanded { background: var(--row-detail); }
  tbody tr.row-detail { background: var(--row-detail); }
  tbody tr.row-detail td { padding: 0; }
  .expand-arrow { display: inline-block; width: 18px; transition: transform 0.2s; color: var(--primary); }
  .expand-arrow.open { transform: rotate(90deg); }

  /* Detail expansion */
  .detail-content { padding: 20px 30px; }
  .channels-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .channel-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .channel-card .channel-name { font-size: 13px; font-weight: 600; color: var(--primary);
                                text-transform: uppercase; margin-bottom: 10px; }
  .channel-card .price-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .channel-card .price-row .label { color: var(--text-muted); }
  .channel-card .price-row .value { font-weight: 600; color: var(--text); }
  .variation-up { color: var(--variation-up); font-weight: 600; }
  .variation-down { color: var(--variation-down); font-weight: 600; }
  .variation-zero { color: var(--text-soft); font-weight: 600; }
  .chart-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
                padding: 16px; height: 320px; }

  /* Modal */
  .modal-bg { position: fixed; inset: 0; background: var(--modal-overlay); display: none;
              align-items: center; justify-content: center; z-index: 100; }
  .modal-bg.show { display: flex; }
  .modal { background: var(--surface); border-radius: 14px; width: 100%; max-width: 560px;
           max-height: 90vh; overflow-y: auto; color: var(--text); }
  .modal-head { padding: 20px 24px; border-bottom: 1px solid var(--border);
                display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { font-size: 18px; }
  .modal-head .close { color: var(--text-soft); font-size: 22px; }
  .modal-body { padding: 24px; }
  .modal-body label { display: block; margin: 12px 0 6px; font-size: 13px; color: var(--text); font-weight: 500; }
  .modal-body input { width: 100%; padding: 10px 12px; border: 1px solid var(--input-border); border-radius: 8px;
                      font-size: 14px; background: var(--input-bg); color: var(--text); }
  .modal-body input:focus { outline: none; border-color: var(--input-focus); }
  .modal-body .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .modal-body .section-title { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border);
                               font-size: 13px; font-weight: 600; color: var(--primary); text-transform: uppercase; }
  .modal-foot { padding: 16px 24px; border-top: 1px solid var(--border);
                display: flex; justify-content: flex-end; gap: 10px; }
  .modal .alert { padding: 12px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
  .modal .alert.error { background: var(--error-bg); color: var(--error-text); }
  .modal .alert.success { background: var(--success-bg); color: var(--success-text); }

  /* Empty state */
  .empty { padding: 60px 20px; text-align: center; color: var(--text-soft); }

  /* Histórico */
  .hist-filtros { background: var(--surface); border-radius: 12px; padding: 18px;
                  box-shadow: var(--shadow); border: 1px solid var(--border-light); margin-bottom: 18px;
                  display: grid; grid-template-columns: 1fr 1fr auto; gap: 14px; align-items: end; }
  .hist-filtros .field { display: flex; flex-direction: column; gap: 6px; }
  .hist-filtros label { font-size: 12px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; }
  .hist-filtros input, .hist-filtros select { padding: 10px 12px; border: 1px solid var(--input-border);
                                              border-radius: 8px; font-size: 14px;
                                              background: var(--input-bg); color: var(--text); }
  .hist-filtros input:focus, .hist-filtros select:focus { outline: none; border-color: var(--input-focus); }
  .periodo-grupo { display: flex; gap: 6px; }
  .periodo-btn { padding: 9px 14px; border: 1px solid var(--input-border); background: var(--surface);
                 border-radius: 8px; font-size: 13px; color: var(--text); }
  .periodo-btn:hover { background: var(--row-hover); }
  .periodo-btn.active { background: var(--primary); color: var(--primary-text-on); border-color: var(--primary); }
  .hist-chart-wrap { background: var(--surface); border-radius: 12px; padding: 18px;
                     box-shadow: var(--shadow); border: 1px solid var(--border-light);
                     margin-bottom: 18px; height: 380px; }

  /* Users panel */
  .user-row { display: flex; justify-content: space-between; align-items: center;
              padding: 14px 20px; border-bottom: 1px solid var(--border-light); }
  .user-row .info .name { font-weight: 600; color: var(--text); }
  .user-row .info .email { color: var(--text-muted); font-size: 13px; }
  .badge { padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
  .badge.admin { background: var(--primary-soft); color: var(--primary); }
  .badge.viewer { background: var(--secondary-bg); color: var(--secondary-text); }
  .badge.pending { background: #fef3c7; color: #92400e; }
  .badge.rejected { background: var(--error-bg); color: var(--error-text); }
  .badge.approved { background: var(--success-bg); color: var(--success-text); }
</style>
</head>
<body>

<!-- ============ TELA DE LOGIN ============ -->
<div id="screen-login" class="auth-bg">
  <div class="auth-card">
    <h1>Monitor de Preços</h1>
    <p class="sub">Faça login para acessar</p>
    <form id="form-login">
      <label>E-mail</label>
      <input type="email" id="login-email" required />
      <label>Senha</label>
      <input type="password" id="login-senha" required />
      <button type="submit" class="btn-primary">Entrar</button>
    </form>
    <div id="login-msg"></div>
    <p class="switch">Não tem acesso? <a onclick="showScreen('register')">Solicitar acesso</a></p>
  </div>
</div>

<!-- ============ TELA DE CADASTRO ============ -->
<div id="screen-register" class="auth-bg" style="display:none;">
  <div class="auth-card">
    <h1>Solicitar acesso</h1>
    <p class="sub">Cadastre-se e aguarde aprovação</p>
    <form id="form-register">
      <label>Nome</label>
      <input type="text" id="reg-nome" required />
      <label>E-mail</label>
      <input type="email" id="reg-email" required />
      <label>Senha</label>
      <input type="password" id="reg-senha" required />
      <button type="submit" class="btn-primary">Solicitar acesso</button>
    </form>
    <div id="register-msg"></div>
    <p class="switch">Já tem acesso? <a onclick="showScreen('login')">Voltar ao login</a></p>
  </div>
</div>

<!-- ============ APP ============ -->
<div id="screen-app" class="app" style="display:none;">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="logo">
      <span class="icon">📊</span>
      <span>Monitor</span>
    </div>
    <button class="toggle" onclick="toggleSidebar()">
      <span class="toggle-icon">≡</span>
      <span>Recolher menu</span>
    </button>
    <nav>
      <button id="nav-produtos" class="active" onclick="setTab('produtos')">
        <span class="icon">📦</span><span class="label">Produtos</span>
      </button>
      <button id="nav-historico" onclick="setTab('historico')">
        <span class="icon">📈</span><span class="label">Histórico</span>
      </button>
      <button id="nav-usuarios" style="display:none;" onclick="setTab('usuarios')">
        <span class="icon">👥</span><span class="label">Usuários</span>
        <span class="badge" id="badge-pendentes" style="display:none;">0</span>
      </button>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()">
      <span class="icon" id="theme-icon">🌙</span>
      <span class="label" id="theme-label">Modo escuro</span>
    </button>
    <div class="user-block">
      <div class="name" id="user-name">—</div>
      <div class="role" id="user-role">—</div>
      <button class="logout" onclick="logout()">Sair</button>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <h2 id="page-title">Produtos</h2>
      <div class="search" id="search-box">
        <span class="icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar por nome, EAN ou SKU..." />
      </div>
    </div>

    <div class="content" id="content"></div>
  </main>
</div>

<!-- ============ MODAL PRODUTO ============ -->
<div class="modal-bg" id="modal-produto">
  <div class="modal">
    <div class="modal-head">
      <h3 id="modal-title">Novo produto</h3>
      <button class="close" onclick="fecharModal()">×</button>
    </div>
    <div class="modal-body">
      <div id="modal-alert"></div>
      <div id="modal-form">
        <label>Nome do produto *</label>
        <input type="text" id="p-nome" />
        <div class="row-2">
          <div>
            <label>SKU interno *</label>
            <input type="text" id="p-sku" />
          </div>
          <div>
            <label>EAN *</label>
            <input type="text" id="p-ean" />
          </div>
        </div>
        <div class="row-2">
          <div>
            <label>Palavra-chave 1 *</label>
            <input type="text" id="p-pc1" />
          </div>
          <div>
            <label>Palavra-chave 2</label>
            <input type="text" id="p-pc2" />
          </div>
        </div>

        <div class="section-title">Preço praticado pela empresa por canal</div>
        <div class="row-2">
          <div>
            <label>Mercado Livre (R$)</label>
            <input type="number" step="0.01" id="p-pp-ml" />
          </div>
          <div>
            <label>Amazon (R$)</label>
            <input type="number" step="0.01" id="p-pp-am" />
          </div>
        </div>
        <div class="row-2">
          <div>
            <label>Shopee (R$)</label>
            <input type="number" step="0.01" id="p-pp-sh" />
          </div>
          <div>
            <label>Droga Raia (R$)</label>
            <input type="number" step="0.01" id="p-pp-dr" />
          </div>
        </div>
      </div>

      <div id="modal-success" style="display:none;">
        <div class="alert success">Operação realizada com sucesso!</div>
      </div>
    </div>
    <div class="modal-foot" id="modal-actions">
      <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
      <button class="btn-primary" id="btn-salvar" onclick="salvarProduto()">Salvar</button>
    </div>
    <div class="modal-foot" id="modal-success-actions" style="display:none;">
      <button class="btn-secondary" onclick="fecharModal()">Fechar</button>
      <button class="btn-primary" onclick="abrirModalProduto()">Cadastrar novo</button>
    </div>
  </div>
</div>

<script>
/* ================== ESTADO GLOBAL ================== */
const API = window.location.origin;
let token = localStorage.getItem("mp_token");
let usuario = JSON.parse(localStorage.getItem("mp_user") || "null");
let produtos = [];
let produtoExpandidoId = null;
let produtoEditandoId = null;
let chartCanal = null;
let buscaAtual = "";
const CANAIS = [
  { key: "mercado_livre", label: "Mercado Livre" },
  { key: "amazon", label: "Amazon" },
  { key: "shopee", label: "Shopee" },
  { key: "droga_raia", label: "Droga Raia" },
];

/* ================== INIT ================== */
window.addEventListener("DOMContentLoaded", () => {
  aplicarTema(localStorage.getItem("mp_tema") || "claro");

  if (token && usuario) {
    abrirApp();
  } else {
    showScreen("login");
  }

  document.getElementById("form-login").addEventListener("submit", fazerLogin);
  document.getElementById("form-register").addEventListener("submit", fazerCadastro);
  document.getElementById("busca").addEventListener("input", (e) => {
    buscaAtual = e.target.value.trim();
    if (buscaAtual.length === 0 || buscaAtual.length >= 2) carregarProdutos();
  });
});

/* ================== TEMA ================== */
function aplicarTema(tema) {
  if (tema === "escuro") {
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }
  const icon = document.getElementById("theme-icon");
  const label = document.getElementById("theme-label");
  if (icon && label) {
    if (tema === "escuro") {
      icon.textContent = "☀️";
      label.textContent = "Modo claro";
    } else {
      icon.textContent = "🌙";
      label.textContent = "Modo escuro";
    }
  }
  localStorage.setItem("mp_tema", tema);
}

function toggleTheme() {
  const atual = localStorage.getItem("mp_tema") || "claro";
  aplicarTema(atual === "claro" ? "escuro" : "claro");
}

function showScreen(s) {
  document.getElementById("screen-login").style.display = s === "login" ? "flex" : "none";
  document.getElementById("screen-register").style.display = s === "register" ? "flex" : "none";
  document.getElementById("screen-app").style.display = s === "app" ? "flex" : "none";
}

/* ================== AUTH ================== */
async function fazerLogin(e) {
  e.preventDefault();
  const msg = document.getElementById("login-msg");
  msg.innerHTML = "";
  try {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("login-email").value,
        senha: document.getElementById("login-senha").value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.innerHTML = `<div class="msg error">${data.detail || "Erro no login"}</div>`;
      return;
    }
    token = data.token;
    usuario = { nome: data.nome, perfil: data.perfil };
    localStorage.setItem("mp_token", token);
    localStorage.setItem("mp_user", JSON.stringify(usuario));
    abrirApp();
  } catch (err) {
    msg.innerHTML = `<div class="msg error">Erro de conexão</div>`;
  }
}

async function fazerCadastro(e) {
  e.preventDefault();
  const msg = document.getElementById("register-msg");
  msg.innerHTML = "";
  try {
    const res = await fetch(`${API}/auth/registrar`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome: document.getElementById("reg-nome").value,
        email: document.getElementById("reg-email").value,
        senha: document.getElementById("reg-senha").value,
      }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      msg.innerHTML = `<div class="msg error">${data.detail || "Erro no cadastro"}</div>`;
      return;
    }
    if (data.primeiro_admin) {
      token = data.token;
      usuario = { nome: data.nome, perfil: "admin" };
      localStorage.setItem("mp_token", token);
      localStorage.setItem("mp_user", JSON.stringify(usuario));
      abrirApp();
    } else {
      msg.innerHTML = `<div class="msg success">${data.mensagem}</div>`;
      document.getElementById("form-register").reset();
    }
  } catch (err) {
    msg.innerHTML = `<div class="msg error">Erro de conexão</div>`;
  }
}

function logout() {
  localStorage.clear();
  token = null;
  usuario = null;
  showScreen("login");
}

/* ================== APP ================== */
function abrirApp() {
  document.getElementById("user-name").textContent = usuario.nome;
  document.getElementById("user-role").textContent = usuario.perfil;
  if (usuario.perfil === "admin") {
    document.getElementById("nav-usuarios").style.display = "flex";
    carregarPendentes();
  }
  showScreen("app");
  setTab("produtos");
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}

function setTab(tab) {
  document.getElementById("nav-produtos").classList.toggle("active", tab === "produtos");
  document.getElementById("nav-historico").classList.toggle("active", tab === "historico");
  document.getElementById("nav-usuarios").classList.toggle("active", tab === "usuarios");

  const titulos = { produtos: "Produtos", historico: "Histórico de preços", usuarios: "Usuários" };
  document.getElementById("page-title").textContent = titulos[tab] || "";
  document.getElementById("search-box").style.display = tab === "produtos" ? "block" : "none";

  if (tab === "produtos") renderTelaProdutos();
  else if (tab === "historico") renderTelaHistorico();
  else renderTelaUsuarios();
}

/* ================== PRODUTOS ================== */
async function api(path, opts = {}) {
  const res = await fetch(`${API}${path}`, {
    ...opts,
    headers: {
      "Content-Type": "application/json",
      Authorization: `Bearer ${token}`,
      ...(opts.headers || {}),
    },
  });
  if (res.status === 401) {
    logout();
    throw new Error("Sessão expirada");
  }
  return res;
}

async function renderTelaProdutos() {
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="stats">
      <div class="stat-card">
        <div class="label">Total de produtos</div>
        <div class="value" id="stat-total">—</div>
        <div class="sub" id="stat-total-sub">cadastrados</div>
      </div>
      <div class="stat-card">
        <div class="label">Registros de preço</div>
        <div class="value" id="stat-registros">—</div>
        <div class="sub">no banco</div>
      </div>
      <div class="stat-card">
        <div class="label">Última coleta</div>
        <div class="value" id="stat-ultima">—</div>
        <div class="sub">do n8n</div>
      </div>
    </div>

    <div class="table-card">
      <div class="table-header">
        <h3 id="tabela-titulo">Produtos cadastrados</h3>
        ${usuario.perfil === "admin"
          ? '<button class="btn-primary" onclick="abrirModalProduto()">+ Novo produto</button>'
          : ""}
      </div>
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th style="width:40px;"></th>
              <th>Nome</th>
              <th>SKU</th>
              <th>EAN</th>
              <th>Palavras-chave</th>
              <th style="text-align:right;">Ações</th>
            </tr>
          </thead>
          <tbody id="tbody-produtos">
            <tr><td colspan="6" class="empty">Carregando…</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;
  await carregarProdutos();
}

async function carregarProdutos() {
  if (document.getElementById("nav-produtos").classList.contains("active") === false) return;
  const url = buscaAtual ? `/produtos?busca=${encodeURIComponent(buscaAtual)}` : `/produtos`;
  try {
    const res = await api(url);
    produtos = await res.json();
  } catch (e) {
    produtos = [];
  }
  renderTabela();
  carregarEstatisticas();
}

async function carregarEstatisticas() {
  let url = "/estatisticas";
  if (buscaAtual && produtos.length === 1) url += `?produto_id=${produtos[0].id}`;
  try {
    const res = await api(url);
    const d = await res.json();
    document.getElementById("stat-total").textContent = d.total_produtos ?? "—";
    document.getElementById("stat-registros").textContent = d.total_registros ?? "—";
    if (d.ultima_coleta) {
      const dt = new Date(d.ultima_coleta);
      document.getElementById("stat-ultima").textContent =
        dt.toLocaleDateString("pt-BR") + " " + dt.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
    } else {
      document.getElementById("stat-ultima").textContent = "—";
    }
    if (buscaAtual && produtos.length === 1) {
      document.getElementById("stat-total-sub").textContent = `do produto "${produtos[0].nome}"`;
    } else {
      document.getElementById("stat-total-sub").textContent = "cadastrados";
    }
  } catch (e) {}
}

function renderTabela() {
  const tbody = document.getElementById("tbody-produtos");
  if (!tbody) return;
  if (produtos.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="empty">Nenhum produto encontrado</td></tr>`;
    return;
  }
  tbody.innerHTML = produtos.map(p => `
    <tr class="row-main ${produtoExpandidoId === p.id ? "expanded" : ""}" onclick="toggleProduto('${p.id}')">
      <td><span class="expand-arrow ${produtoExpandidoId === p.id ? "open" : ""}">▶</span></td>
      <td><strong>${escapeHtml(p.nome)}</strong></td>
      <td>${escapeHtml(p.sku || "—")}</td>
      <td>${escapeHtml(p.ean || "—")}</td>
      <td>${[p.palavra_chave_1, p.palavra_chave_2].filter(x => x).map(escapeHtml).join(", ")}</td>
      <td style="text-align:right;" onclick="event.stopPropagation();">
        ${usuario.perfil === "admin" ? `
          <button class="btn-edit" onclick="abrirModalProduto('${p.id}')">Editar</button>
          <button class="btn-danger" onclick="excluirProduto('${p.id}')">Excluir</button>
        ` : ""}
      </td>
    </tr>
    <tr class="row-detail" id="detail-${p.id}" style="display:${produtoExpandidoId === p.id ? "table-row" : "none"};">
      <td colspan="6">
        <div class="detail-content" id="detail-content-${p.id}">
          <div class="empty">Carregando…</div>
        </div>
      </td>
    </tr>
  `).join("");
  if (produtoExpandidoId) carregarDetalhe(produtoExpandidoId);
}

async function toggleProduto(id) {
  if (produtoExpandidoId === id) {
    produtoExpandidoId = null;
  } else {
    produtoExpandidoId = id;
  }
  renderTabela();
}

async function carregarDetalhe(id) {
  const produto = produtos.find(p => p.id === id);
  if (!produto) return;
  const cont = document.getElementById(`detail-content-${id}`);
  if (!cont) return;

  let canais = {};
  let historico = [];
  try {
    const [r1, r2] = await Promise.all([
      api(`/produtos/${id}/canais`),
      api(`/produtos/${id}/historico?dias=30`),
    ]);
    canais = await r1.json();
    historico = await r2.json();
  } catch (e) {}

  const pp = produto.precos_praticados || {};

  cont.innerHTML = `
    <div class="channels-grid">
      ${CANAIS.map(c => {
        const dados = canais[c.key] || {};
        const meuPreco = pp[c.key];
        const menor = dados.menor_preco_atual;
        const variacao = dados.variacao_media_7d;
        return `
          <div class="channel-card">
            <div class="channel-name">${c.label}</div>
            <div class="price-row">
              <span class="label">Meu preço</span>
              <span class="value">${meuPreco != null ? formatBRL(meuPreco) : "—"}</span>
            </div>
            <div class="price-row">
              <span class="label">Menor concorrente</span>
              <span class="value">${menor != null ? formatBRL(menor) : "—"}</span>
            </div>
            <div class="price-row">
              <span class="label">Variação média 7d</span>
              <span class="value">${formatVariacao(variacao)}</span>
            </div>
            <div class="price-row" style="border-top:1px solid #f3f4f6; margin-top:6px; padding-top:8px;">
              <span class="label">Coletas 7d</span>
              <span class="value">${dados.registros || 0}</span>
            </div>
          </div>
        `;
      }).join("")}
    </div>
    <div class="chart-wrap">
      <canvas id="chart-${id}"></canvas>
    </div>
  `;

  desenharGrafico(id, historico);
}

function desenharGrafico(id, historico) {
  const ctx = document.getElementById(`chart-${id}`);
  if (!ctx) return;
  if (chartCanal) { chartCanal.destroy(); chartCanal = null; }

  // Conjunto único de timestamps (rótulos do eixo X)
  const labelSet = new Set();
  historico.forEach(h => labelSet.add(h.data));
  const labels = Array.from(labelSet).sort();
  const labelsFormat = labels.map(l => {
    const d = new Date(l);
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {hour:"2-digit", minute:"2-digit"});
  });

  // Agrupa preços por canal alinhados aos labels
  const porCanal = {};
  CANAIS.forEach(c => porCanal[c.key] = labels.map(() => null));
  historico.forEach(h => {
    if (!porCanal[h.canal]) return;
    const idx = labels.indexOf(h.data);
    if (idx >= 0) porCanal[h.canal][idx] = h.preco;
  });

  const cores = {
    mercado_livre: "#facc15",
    amazon: "#fb923c",
    shopee: "#f43f5e",
    droga_raia: "#3b82f6",
  };

  const datasets = CANAIS.map(c => ({
    label: c.label,
    data: porCanal[c.key],
    borderColor: cores[c.key],
    backgroundColor: cores[c.key] + "30",
    tension: 0.3,
    spanGaps: true,
  })).filter(ds => ds.data.some(v => v != null));

  if (datasets.length === 0) {
    ctx.parentElement.innerHTML = '<div class="empty">Sem histórico ainda — aguarde a primeira coleta do n8n.</div>';
    return;
  }

  chartCanal = new Chart(ctx, {
    type: "line",
    data: { labels: labelsFormat, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: {
        x: { ticks: { maxTicksLimit: 8 } },
        y: { ticks: { callback: v => "R$ " + v.toFixed(2) } },
      },
    },
  });
}

/* ================== MODAL PRODUTO ================== */
function abrirModalProduto(id = null) {
  produtoEditandoId = id;
  document.getElementById("modal-title").textContent = id ? "Editar produto" : "Novo produto";
  document.getElementById("modal-alert").innerHTML = "";
  document.getElementById("modal-form").style.display = "block";
  document.getElementById("modal-success").style.display = "none";
  document.getElementById("modal-actions").style.display = "flex";
  document.getElementById("modal-success-actions").style.display = "none";

  if (id) {
    const p = produtos.find(x => x.id === id);
    if (p) {
      document.getElementById("p-nome").value = p.nome || "";
      document.getElementById("p-sku").value = p.sku || "";
      document.getElementById("p-ean").value = p.ean || "";
      document.getElementById("p-pc1").value = p.palavra_chave_1 || "";
      document.getElementById("p-pc2").value = p.palavra_chave_2 || "";
      const pp = p.precos_praticados || {};
      document.getElementById("p-pp-ml").value = pp.mercado_livre ?? "";
      document.getElementById("p-pp-am").value = pp.amazon ?? "";
      document.getElementById("p-pp-sh").value = pp.shopee ?? "";
      document.getElementById("p-pp-dr").value = pp.droga_raia ?? "";
    }
  } else {
    ["p-nome","p-sku","p-ean","p-pc1","p-pc2","p-pp-ml","p-pp-am","p-pp-sh","p-pp-dr"]
      .forEach(i => document.getElementById(i).value = "");
  }
  document.getElementById("modal-produto").classList.add("show");
}

function fecharModal() {
  document.getElementById("modal-produto").classList.remove("show");
  produtoEditandoId = null;
}

async function salvarProduto() {
  const alert = document.getElementById("modal-alert");
  alert.innerHTML = "";

  const nome = document.getElementById("p-nome").value.trim();
  const sku = document.getElementById("p-sku").value.trim();
  const ean = document.getElementById("p-ean").value.trim();
  const pc1 = document.getElementById("p-pc1").value.trim();
  const pc2 = document.getElementById("p-pc2").value.trim();

  if (!nome || !sku || !ean || !pc1) {
    alert.innerHTML = '<div class="alert error">Preencha nome, SKU, EAN e palavra-chave 1.</div>';
    return;
  }

  const pp = {
    mercado_livre: parseNum(document.getElementById("p-pp-ml").value),
    amazon: parseNum(document.getElementById("p-pp-am").value),
    shopee: parseNum(document.getElementById("p-pp-sh").value),
    droga_raia: parseNum(document.getElementById("p-pp-dr").value),
  };

  const payload = {
    nome, sku, ean,
    palavra_chave_1: pc1,
    palavra_chave_2: pc2,
    precos_praticados: pp,
  };

  const url = produtoEditandoId ? `/produtos/${produtoEditandoId}` : "/produtos";
  const method = produtoEditandoId ? "PUT" : "POST";

  try {
    const res = await api(url, { method, body: JSON.stringify(payload) });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) {
      alert.innerHTML = `<div class="alert error">${data.detail || "Erro ao salvar"}</div>`;
      return;
    }

    document.getElementById("modal-form").style.display = "none";
    document.getElementById("modal-actions").style.display = "none";
    document.getElementById("modal-success").style.display = "block";
    document.getElementById("modal-success").innerHTML = `<div class="alert success">${data.mensagem || (produtoEditandoId ? "Produto atualizado!" : "Produto cadastrado com sucesso!")}</div>`;
    document.getElementById("modal-success-actions").style.display = "flex";
    await carregarProdutos();
  } catch (e) {
    alert.innerHTML = '<div class="alert error">Erro de conexão</div>';
  }
}

async function excluirProduto(id) {
  if (!confirm("Tem certeza que deseja excluir este produto e todo o histórico?")) return;
  try {
    const res = await api(`/produtos/${id}`, { method: "DELETE" });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      alert(d.detail || "Erro ao excluir");
      return;
    }
    await carregarProdutos();
  } catch (e) {
    alert("Erro de conexão");
  }
}

/* ================== HISTÓRICO ================== */
let histProdutoId = null;
let histDias = 30;
let histTodos = [];           // produtos disponíveis (cache)
let histChart = null;

async function renderTelaHistorico() {
  // Busca produtos pra alimentar o seletor
  try {
    const res = await api("/produtos");
    histTodos = await res.json();
  } catch (e) { histTodos = []; }

  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="hist-filtros">
      <div class="field">
        <label>Buscar produto</label>
        <input type="text" id="hist-busca" placeholder="Nome, SKU ou EAN..." />
      </div>
      <div class="field">
        <label>Produto</label>
        <select id="hist-produto"></select>
      </div>
      <div class="field">
        <label>Período</label>
        <div class="periodo-grupo" id="hist-periodos">
          <button class="periodo-btn" data-dias="7">7d</button>
          <button class="periodo-btn" data-dias="15">15d</button>
          <button class="periodo-btn active" data-dias="30">30d</button>
          <button class="periodo-btn" data-dias="60">60d</button>
          <button class="periodo-btn" data-dias="90">90d</button>
        </div>
      </div>
    </div>

    <div class="hist-chart-wrap">
      <canvas id="hist-chart"></canvas>
    </div>

    <div class="table-card">
      <div class="table-header"><h3>Coletas</h3></div>
      <div class="table-scroll" style="max-height:300px;">
        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Canal</th>
              <th>Preço</th>
              <th>Vendedor</th>
            </tr>
          </thead>
          <tbody id="hist-tabela">
            <tr><td colspan="4" class="empty">Selecione um produto</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  `;

  preencherSelectHistorico("");

  document.getElementById("hist-busca").addEventListener("input", (e) => {
    preencherSelectHistorico(e.target.value.trim());
  });
  document.getElementById("hist-produto").addEventListener("change", (e) => {
    histProdutoId = e.target.value || null;
    carregarHistorico();
  });
  document.getElementById("hist-periodos").addEventListener("click", (e) => {
    const b = e.target.closest("button.periodo-btn");
    if (!b) return;
    document.querySelectorAll("#hist-periodos .periodo-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");
    histDias = parseInt(b.dataset.dias);
    carregarHistorico();
  });

  // Se já tinha um produto selecionado anteriormente, carrega
  if (histProdutoId) {
    document.getElementById("hist-produto").value = histProdutoId;
    carregarHistorico();
  }
}

function preencherSelectHistorico(busca) {
  const sel = document.getElementById("hist-produto");
  if (!sel) return;
  const termo = (busca || "").toLowerCase();
  const filtrados = histTodos.filter(p => {
    if (!termo) return true;
    return (p.nome || "").toLowerCase().includes(termo)
        || (p.sku || "").toLowerCase().includes(termo)
        || (p.ean || "").toLowerCase().includes(termo);
  });

  sel.innerHTML = `<option value="">— escolha um produto —</option>` +
    filtrados.map(p => `<option value="${p.id}">${escapeHtml(p.nome)} (SKU ${escapeHtml(p.sku || "—")})</option>`).join("");

  if (histProdutoId && filtrados.find(p => p.id === histProdutoId)) {
    sel.value = histProdutoId;
  } else {
    histProdutoId = null;
  }
}

async function carregarHistorico() {
  if (!histProdutoId) {
    document.getElementById("hist-tabela").innerHTML =
      `<tr><td colspan="4" class="empty">Selecione um produto</td></tr>`;
    if (histChart) { histChart.destroy(); histChart = null; }
    const ctx = document.getElementById("hist-chart");
    if (ctx) ctx.getContext("2d").clearRect(0, 0, ctx.width, ctx.height);
    return;
  }

  let historico = [];
  try {
    const res = await api(`/produtos/${histProdutoId}/historico?dias=${histDias}`);
    historico = await res.json();
  } catch (e) { historico = []; }

  // Tabela
  const tb = document.getElementById("hist-tabela");
  if (historico.length === 0) {
    tb.innerHTML = `<tr><td colspan="4" class="empty">Sem coletas no período de ${histDias} dias</td></tr>`;
  } else {
    const labelCanal = { mercado_livre: "Mercado Livre", amazon: "Amazon", shopee: "Shopee", droga_raia: "Droga Raia" };
    tb.innerHTML = historico.slice().reverse().map(h => {
      const d = new Date(h.data);
      return `
        <tr>
          <td>${d.toLocaleDateString("pt-BR")} ${d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"})}</td>
          <td>${escapeHtml(labelCanal[h.canal] || h.canal || "—")}</td>
          <td>${formatBRL(h.preco)}</td>
          <td>${escapeHtml(h.vendedor || "—")}</td>
        </tr>
      `;
    }).join("");
  }

  desenharGraficoHistorico(historico);
}

function desenharGraficoHistorico(historico) {
  const ctx = document.getElementById("hist-chart");
  if (!ctx) return;
  if (histChart) { histChart.destroy(); histChart = null; }

  const labelSet = new Set();
  historico.forEach(h => labelSet.add(h.data));
  const labels = Array.from(labelSet).sort();
  const labelsFormat = labels.map(l => {
    const d = new Date(l);
    return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  });

  const porCanal = {};
  CANAIS.forEach(c => porCanal[c.key] = labels.map(() => null));
  historico.forEach(h => {
    if (!porCanal[h.canal]) return;
    const idx = labels.indexOf(h.data);
    if (idx >= 0) porCanal[h.canal][idx] = h.preco;
  });

  const cores = {
    mercado_livre: "#facc15",
    amazon: "#fb923c",
    shopee: "#f43f5e",
    droga_raia: "#3b82f6",
  };

  const datasets = CANAIS.map(c => ({
    label: c.label,
    data: porCanal[c.key],
    borderColor: cores[c.key],
    backgroundColor: cores[c.key] + "30",
    tension: 0.3,
    spanGaps: true,
  })).filter(ds => ds.data.some(v => v != null));

  if (datasets.length === 0) {
    if (histChart) { histChart.destroy(); histChart = null; }
    ctx.parentElement.innerHTML = '<div class="empty">Sem coletas no período selecionado.</div>';
    // restaura o canvas pra próxima renderização
    setTimeout(() => {
      const wrap = document.querySelector(".hist-chart-wrap");
      if (wrap && !document.getElementById("hist-chart")) {
        wrap.innerHTML = '<canvas id="hist-chart"></canvas>';
      }
    }, 0);
    return;
  }

  histChart = new Chart(ctx, {
    type: "line",
    data: { labels: labelsFormat, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: {
        x: { ticks: { maxTicksLimit: 10 } },
        y: { ticks: { callback: v => "R$ " + v.toFixed(2) } },
      },
    },
  });
}

/* ================== USUÁRIOS ================== */
async function renderTelaUsuarios() {
  const c = document.getElementById("content");
  c.innerHTML = `
    <div class="table-card">
      <div class="table-header"><h3>Solicitações pendentes</h3></div>
      <div class="table-scroll" id="tbody-pendentes">Carregando…</div>
    </div>
    <div style="height:18px;"></div>
    <div class="table-card">
      <div class="table-header"><h3>Usuários cadastrados</h3></div>
      <div class="table-scroll" id="tbody-usuarios">Carregando…</div>
    </div>
  `;
  await carregarPendentes();
  await carregarUsuarios();
}

async function carregarPendentes() {
  try {
    const res = await api("/pendentes");
    const lista = await res.json();
    const badge = document.getElementById("badge-pendentes");
    if (lista.length > 0) {
      badge.textContent = lista.length;
      badge.style.display = "inline-block";
    } else {
      badge.style.display = "none";
    }
    const cont = document.getElementById("tbody-pendentes");
    if (!cont) return;
    if (lista.length === 0) {
      cont.innerHTML = '<div class="empty">Nenhuma solicitação pendente</div>';
      return;
    }
    cont.innerHTML = lista.map(u => `
      <div class="user-row">
        <div class="info">
          <div class="name">${escapeHtml(u.nome)}</div>
          <div class="email">${escapeHtml(u.email)}</div>
        </div>
        <div style="display:flex; gap:6px; align-items:center;">
          <button class="btn-edit" onclick="aprovarUsuario('${u.id}','admin')">Aprovar como Admin</button>
          <button class="btn-edit" onclick="aprovarUsuario('${u.id}','visualizador')">Aprovar Visualizador</button>
          <button class="btn-danger" onclick="rejeitarUsuario('${u.id}')">Rejeitar</button>
        </div>
      </div>
    `).join("");
  } catch (e) {}
}

async function carregarUsuarios() {
  try {
    const res = await api("/usuarios");
    const lista = await res.json();
    const cont = document.getElementById("tbody-usuarios");
    if (!cont) return;
    cont.innerHTML = lista.map(u => `
      <div class="user-row">
        <div class="info">
          <div class="name">${escapeHtml(u.nome)}</div>
          <div class="email">${escapeHtml(u.email)}</div>
        </div>
        <div style="display:flex; gap:8px; align-items:center;">
          <span class="badge ${u.perfil === 'admin' ? 'admin' : 'viewer'}">${u.perfil}</span>
          <span class="badge ${u.status === 'aprovado' ? 'approved' : u.status === 'pendente' ? 'pending' : 'rejected'}">${u.status}</span>
        </div>
      </div>
    `).join("");
  } catch (e) {}
}

async function aprovarUsuario(id, perfil) {
  await api(`/aprovar/${id}?perfil=${perfil}`, { method: "POST" });
  carregarPendentes();
  carregarUsuarios();
}

async function rejeitarUsuario(id) {
  await api(`/rejeitar/${id}`, { method: "POST" });
  carregarPendentes();
  carregarUsuarios();
}

/* ================== HELPERS ================== */
function formatBRL(v) {
  if (v == null) return "—";
  return v.toLocaleString("pt-BR", { style: "currency", currency: "BRL" });
}

function formatVariacao(v) {
  if (v == null) return '<span class="variation-zero">—</span>';
  if (v > 0) return `<span class="variation-up">▲ ${v.toFixed(2)}%</span>`;
  if (v < 0) return `<span class="variation-down">▼ ${Math.abs(v).toFixed(2)}%</span>`;
  return '<span class="variation-zero">0,00%</span>';
}

function parseNum(v) {
  if (v === "" || v == null) return null;
  const n = parseFloat(v);
  return isNaN(n) ? null : n;
}

function escapeHtml(s) {
  if (s == null) return "";
  return String(s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
