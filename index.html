<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Monitor de Preços</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #f7faf7;
    --surface: #ffffff;
    --surface-2: #f0fdf4;
    --text: #0f172a;
    --text-muted: #64748b;
    --text-soft: #94a3b8;
    --border: #e5e7eb;
    --border-light: #f1f5f9;
    --primary: #16a34a;
    --primary-hover: #15803d;
    --primary-soft: #dcfce7;
    --primary-text-on: #ffffff;
    --sidebar-bg: #14532d;
    --sidebar-text: #ffffff;
    --sidebar-text-muted: #bbf7d0;
    --sidebar-border: #166534;
    --sidebar-hover: #166534;
    --sidebar-active: #16a34a;
    --topbar-bg: #ffffff;
    --topbar-border: #e5e7eb;
    --input-bg: #ffffff;
    --input-border: #d1d5db;
    --input-focus: #16a34a;
    --row-hover: #f0fdf4;
    --thead-bg: #f0fdf4;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg: 0 18px 45px rgba(0,0,0,0.18);
    --modal-overlay: rgba(0,0,0,0.5);
    --success-bg: #dcfce7;
    --success-text: #065f46;
    --error-bg: #fee2e2;
    --error-text: #b91c1c;
    --secondary-bg: #e5e7eb;
    --secondary-text: #374151;
    --secondary-hover: #d1d5db;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --danger-hover: #fee2e2;
    --warning-bg: #fef3c7;
    --warning-text: #92400e;
    --orange-bg: #ffedd5;
    --orange-text: #c2410c;
    --variation-up: #16a34a;
    --variation-down: #dc2626;
    --auth-gradient: linear-gradient(135deg, #14532d 0%, #16a34a 100%);
  }

  [data-theme="dark"] {
    --bg: #0a0f0c;
    --surface: #14201a;
    --surface-2: #0f1a14;
    --text: #f0fdf4;
    --text-muted: #94a3b8;
    --text-soft: #64748b;
    --border: #1f3a2b;
    --border-light: #1a2e22;
    --primary: #22c55e;
    --primary-hover: #16a34a;
    --primary-soft: rgba(34,197,94,0.15);
    --primary-text-on: #0a0f0c;
    --sidebar-bg: #050a07;
    --sidebar-text: #f0fdf4;
    --sidebar-text-muted: #4ade80;
    --sidebar-border: #14201a;
    --sidebar-hover: #14201a;
    --sidebar-active: #16a34a;
    --topbar-bg: #14201a;
    --topbar-border: #1f3a2b;
    --input-bg: #0f1a14;
    --input-border: #1f3a2b;
    --input-focus: #22c55e;
    --row-hover: #1a2e22;
    --thead-bg: #0f1a14;
    --shadow: 0 1px 3px rgba(0,0,0,0.4);
    --shadow-lg: 0 18px 45px rgba(0,0,0,0.55);
    --modal-overlay: rgba(0,0,0,0.7);
    --success-bg: rgba(34,197,94,0.18);
    --success-text: #4ade80;
    --error-bg: rgba(239,68,68,0.15);
    --error-text: #f87171;
    --secondary-bg: #1f3a2b;
    --secondary-text: #f0fdf4;
    --secondary-hover: #2d4a3a;
    --danger-bg: rgba(239,68,68,0.12);
    --danger-text: #f87171;
    --danger-hover: rgba(239,68,68,0.2);
    --warning-bg: rgba(245,158,11,0.16);
    --warning-text: #fbbf24;
    --orange-bg: rgba(249,115,22,0.16);
    --orange-text: #fb923c;
    --variation-up: #4ade80;
    --variation-down: #f87171;
    --auth-gradient: linear-gradient(135deg, #050a07 0%, #14532d 100%);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }

  html,
  body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
  }

  button {
    cursor: pointer;
    border: none;
    background: none;
    font-size: inherit;
    color: inherit;
  }

  input,
  select {
    font-size: inherit;
    font-family: inherit;
  }

  .auth-bg {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--auth-gradient);
  }

  .auth-card {
    background: var(--surface);
    padding: 40px;
    border-radius: 12px;
    width: 100%;
    max-width: 420px;
    box-shadow: var(--shadow-lg);
  }

  .auth-card h1 {
    text-align: center;
    margin-bottom: 8px;
    color: var(--primary);
    font-size: 28px;
  }

  .auth-card .sub {
    text-align: center;
    color: var(--text-muted);
    margin-bottom: 28px;
    font-size: 14px;
  }

  .auth-card label {
    display: block;
    margin: 14px 0 6px;
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .auth-card input {
    width: 100%;
    padding: 12px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
  }

  .auth-card input:focus {
    outline: none;
    border-color: var(--input-focus);
  }

  .auth-card .btn-primary {
    width: 100%;
    margin-top: 22px;
    padding: 12px;
  }

  .auth-card .switch {
    text-align: center;
    margin-top: 18px;
    color: var(--text-muted);
    font-size: 14px;
  }

  .auth-card .switch a {
    color: var(--primary);
    font-weight: 600;
    cursor: pointer;
  }

  .msg {
    padding: 12px;
    border-radius: 8px;
    margin-top: 14px;
    font-size: 14px;
    text-align: center;
  }

  .msg.error,
  .alert.error {
    background: var(--error-bg);
    color: var(--error-text);
  }

  .msg.success,
  .alert.success {
    background: var(--success-bg);
    color: var(--success-text);
  }

  .app {
    display: flex;
    height: 100vh;
    overflow: hidden;
  }

  .sidebar {
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    width: 240px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    height: 100vh;
    transition: width 0.25s ease;
    overflow: hidden;
  }

  .sidebar.collapsed {
    width: 64px;
  }

  .sidebar .logo {
    padding: 18px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 18px;
    font-weight: 700;
    border-bottom: 1px solid var(--sidebar-border);
    white-space: nowrap;
  }

  .sidebar .toggle {
    padding: 12px 20px;
    color: var(--sidebar-text-muted);
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 14px;
  }

  .sidebar .toggle:hover {
    color: var(--sidebar-text);
  }

  .sidebar nav {
    flex: 1;
    padding: 12px 0;
    overflow-y: auto;
  }

  .sidebar nav button {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 12px 20px;
    color: var(--sidebar-text);
    text-align: left;
    white-space: nowrap;
    position: relative;
    opacity: 0.88;
  }

  .sidebar nav button:hover {
    background: var(--sidebar-hover);
    opacity: 1;
  }

  .sidebar nav button.active {
    background: var(--sidebar-active);
    opacity: 1;
  }

  .sidebar nav button .icon {
    min-width: 22px;
    text-align: center;
  }

  .sidebar nav button .badge {
    background: #ef4444;
    color: #fff;
    font-size: 11px;
    border-radius: 10px;
    padding: 2px 7px;
    margin-left: auto;
  }

  .sidebar.collapsed .label,
  .sidebar.collapsed .logo span:not(.icon),
  .sidebar.collapsed .toggle span:not(.toggle-icon),
  .sidebar.collapsed .badge {
    display: none;
  }

  .sidebar .user-block {
    padding: 14px 20px;
    border-top: 1px solid var(--sidebar-border);
    font-size: 13px;
  }

  .sidebar .user-block .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .sidebar .user-block .role {
    color: var(--sidebar-text-muted);
    font-size: 11px;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .sidebar .user-block .logout {
    margin-top: 10px;
    color: #fca5a5;
    font-size: 13px;
  }

  .sidebar.collapsed .user-block .name,
  .sidebar.collapsed .user-block .role {
    display: none;
  }

  .theme-toggle {
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--sidebar-text-muted);
    font-size: 13px;
    border-top: 1px solid var(--sidebar-border);
  }

  .theme-toggle:hover {
    color: var(--sidebar-text);
    background: var(--sidebar-hover);
  }

  .theme-toggle .icon {
    min-width: 22px;
    text-align: center;
  }

  .sidebar.collapsed .theme-toggle .label {
    display: none;
  }

  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    height: 100vh;
    overflow: hidden;
  }

  .topbar {
    background: var(--topbar-bg);
    padding: 18px 30px;
    border-bottom: 1px solid var(--topbar-border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }

  .topbar h2 {
    font-size: 22px;
    color: var(--text);
  }

  .topbar .search input {
    padding: 10px 14px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    width: 320px;
    background: var(--input-bg);
    color: var(--text);
  }

  .topbar .search input:focus {
    outline: none;
    border-color: var(--input-focus);
  }

  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 30px;
  }

  .small-meta {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 12px;
  }

  .filters {
    background: var(--surface);
    border-radius: 8px;
    padding: 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    gap: 14px;
    align-items: end;
  }

  .filters .field,
  .hist-filtros .field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .filters label,
  .hist-filtros label {
    font-size: 12px;
    color: var(--text-muted);
    font-weight: 600;
    text-transform: uppercase;
  }

  .filters input,
  .filters select,
  .hist-filtros input,
  .hist-filtros select,
  .user-row select {
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
  }

  .stats {
    display: grid;
    grid-template-columns: repeat(3, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }

  .stat-card {
    background: var(--surface);
    border-radius: 8px;
    padding: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
  }

  .stat-card .label {
    color: var(--text-muted);
    font-size: 13px;
    margin-bottom: 6px;
  }

  .stat-card .value {
    font-size: 26px;
    font-weight: 700;
    color: var(--primary);
  }

  .stat-card .sub {
    color: var(--text-soft);
    font-size: 12px;
    margin-top: 4px;
  }

  .dashboard-grid {
    display: grid;
    grid-template-columns: minmax(280px, 0.9fr) minmax(420px, 1.6fr);
    gap: 18px;
    align-items: start;
  }

  .panel {
    background: var(--surface);
    border-radius: 8px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    overflow: hidden;
  }

  .panel-head {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .panel-head h3 {
    font-size: 16px;
  }

  .panel-body {
    padding: 18px 20px;
  }

  .ranking-row {
    display: grid;
    grid-template-columns: 110px 1fr 52px;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    font-size: 13px;
  }

  .ranking-bar {
    height: 10px;
    background: var(--secondary-bg);
    border-radius: 999px;
    overflow: hidden;
  }

  .ranking-fill {
    height: 100%;
    background: var(--primary);
    border-radius: 999px;
  }

  .table-card {
    background: var(--surface);
    border-radius: 8px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    max-height: calc(100vh - 290px);
  }

  .table-card.full {
    max-height: none;
  }

  .table-header {
    padding: 18px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    gap: 12px;
  }

  .table-header h3 {
    font-size: 16px;
    color: var(--text);
  }

  .table-scroll {
    flex: 1;
    overflow-y: auto;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead th {
    position: sticky;
    top: 0;
    background: var(--thead-bg);
    padding: 12px 20px;
    text-align: left;
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    z-index: 1;
  }

  tbody td {
    padding: 14px 20px;
    border-bottom: 1px solid var(--border-light);
    font-size: 14px;
    color: var(--text);
  }

  tbody tr.row-main {
    cursor: pointer;
    transition: background 0.1s;
  }

  tbody tr.row-main:hover {
    background: var(--row-hover);
  }

  .sortable {
    cursor: pointer;
    user-select: none;
    color: var(--primary);
  }

  .btn-primary {
    background: var(--primary);
    color: var(--primary-text-on);
    padding: 9px 18px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
  }

  .btn-primary:hover {
    background: var(--primary-hover);
  }

  .btn-secondary {
    background: var(--secondary-bg);
    color: var(--secondary-text);
    padding: 9px 16px;
    border-radius: 8px;
    font-size: 14px;
  }

  .btn-secondary:hover {
    background: var(--secondary-hover);
  }

  .btn-danger {
    background: var(--danger-bg);
    color: var(--danger-text);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
  }

  .btn-danger:hover {
    background: var(--danger-hover);
  }

  .btn-edit {
    background: var(--primary-soft);
    color: var(--primary);
    padding: 6px 12px;
    border-radius: 6px;
    font-size: 12px;
    margin-right: 6px;
  }

  .btn-edit:hover {
    background: var(--primary);
    color: var(--primary-text-on);
  }

  .detail-open {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--primary);
    font-weight: 600;
    font-size: 13px;
    white-space: nowrap;
  }

  .detail-open .circle {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: var(--primary-soft);
    color: var(--primary);
    font-size: 18px;
    line-height: 1;
  }

  .actions-cell {
    position: relative;
    text-align: right;
  }

  .kebab-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--secondary-bg);
    color: var(--secondary-text);
    font-size: 20px;
    line-height: 1;
  }

  .kebab-btn:hover {
    background: var(--secondary-hover);
  }

  .action-menu {
    display: none;
    position: absolute;
    right: 20px;
    top: 42px;
    min-width: 140px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    z-index: 20;
    overflow: hidden;
  }

  .action-menu.show {
    display: block;
  }

  .action-menu button {
    width: 100%;
    padding: 10px 12px;
    text-align: left;
    font-size: 13px;
    color: var(--text);
  }

  .action-menu button:hover {
    background: var(--row-hover);
  }

  .action-menu button.danger {
    color: var(--danger-text);
  }

  .product-detail-page {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .detail-toolbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }

  .detail-title {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 18px 20px;
    display: flex;
    justify-content: space-between;
    gap: 14px;
    align-items: flex-start;
  }

  .detail-title h3 {
    font-size: 22px;
    color: var(--text);
    margin-bottom: 4px;
  }

  .detail-title p {
    color: var(--text-muted);
    font-size: 13px;
    line-height: 1.6;
  }

  .channel-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .channel-filter button {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--surface);
    color: var(--text);
    font-size: 13px;
  }

  .channel-filter button:hover {
    background: var(--row-hover);
  }

  .channel-filter button.active {
    background: var(--primary);
    border-color: var(--primary);
    color: var(--primary-text-on);
  }

  .channels-table-wrap {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
  }

  .channels-table-wrap table td,
  .channels-table-wrap table th {
    white-space: nowrap;
  }

  .chart-wrap {
    background: var(--surface);
    border: 1px solid var(--border-light);
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 16px;
    height: 360px;
  }

  .variation-up {
    color: var(--variation-up);
    font-weight: 600;
  }

  .variation-down {
    color: var(--variation-down);
    font-weight: 600;
  }

  .variation-zero {
    color: var(--text-soft);
    font-weight: 600;
  }

  .status-badge {
    display: inline-flex;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 12px;
    font-weight: 700;
    white-space: nowrap;
  }

  .status-ganhando {
    background: var(--success-bg);
    color: var(--success-text);
  }

  .status-competitivo {
    background: var(--primary-soft);
    color: var(--primary);
  }

  .status-acima {
    background: var(--warning-bg);
    color: var(--warning-text);
  }

  .status-muito-acima {
    background: var(--error-bg);
    color: var(--error-text);
  }

  .hist-filtros {
    background: var(--surface);
    border-radius: 8px;
    padding: 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    margin-bottom: 18px;
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 14px;
    align-items: end;
  }

  .periodo-grupo {
    display: flex;
    gap: 6px;
  }

  .periodo-btn {
    padding: 9px 14px;
    border: 1px solid var(--input-border);
    background: var(--surface);
    border-radius: 8px;
    font-size: 13px;
    color: var(--text);
  }

  .periodo-btn.active {
    background: var(--primary);
    color: var(--primary-text-on);
    border-color: var(--primary);
  }

  .hist-chart-wrap {
    background: var(--surface);
    border-radius: 8px;
    padding: 18px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border-light);
    margin-bottom: 18px;
    height: 480px;
  }

  .modal-bg {
    position: fixed;
    inset: 0;
    background: var(--modal-overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }

  .modal-bg.show {
    display: flex;
  }

  .modal {
    background: var(--surface);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    max-height: 90vh;
    overflow-y: auto;
    color: var(--text);
  }

  .modal-head {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .modal-head h3 {
    font-size: 18px;
  }

  .modal-head .close {
    color: var(--text-soft);
    font-size: 22px;
  }

  .modal-body {
    padding: 24px;
  }

  .modal-body label {
    display: block;
    margin: 12px 0 6px;
    font-size: 13px;
    color: var(--text);
    font-weight: 500;
  }

  .modal-body input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--input-border);
    border-radius: 8px;
    background: var(--input-bg);
    color: var(--text);
  }

  .modal-body input:focus {
    outline: none;
    border-color: var(--input-focus);
  }

  .modal-body .row-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }

  .modal-body .section-title {
    margin-top: 22px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
    color: var(--primary);
    text-transform: uppercase;
  }

  .modal-foot {
    padding: 16px 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }

  .alert {
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 14px;
    font-size: 14px;
  }

  .empty {
    padding: 60px 20px;
    text-align: center;

  .user-row {

    border-bottom: 1px solid var(--border-light);

  }

  .user-row .info .name {

    color: var(--text);
  }

  .user-row .info .email {
    color: var(--text-muted);
    font-size: 13px;
  }

  .badge {
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
  }

  .badge.master {
    background: var(--primary);
    color: var(--primary-text-on);
  }

  .badge.admin {
    background: var(--primary-soft);
    color: var(--primary);
  }

  .badge.viewer {
    background: var(--secondary-bg);
    color: var(--secondary-text);
  }

  .badge.pending {
    background: #fef3c7;
    color: #92400e;
  }

  .badge.rejected {
    background: var(--error-bg);
    color: var(--error-text);
  }

  .badge.approved {
    background: var(--success-bg);
    color: var(--success-text);
  }

  @media (max-width: 1100px) {
    .dashboard-grid {
      grid-template-columns: 1fr;
    }

    .stats {
      grid-template-columns: repeat(2, minmax(160px, 1fr));
    }
  }

  @media (max-width: 900px) {
    .sidebar {
      width: 72px;
    }

    .sidebar .label,
    .sidebar .logo span:not(.icon),
    .sidebar .toggle span:not(.toggle-icon),
    .sidebar .badge,
    .theme-toggle .label,
    .user-block .name,
    .user-block .role {
      display: none;
    }

    .topbar {
      padding: 14px 16px;
    }

    .topbar .search input {

    }

</style>

<script>
const CANAIS = [
  { key: "mercado_livre", label: "Mercado Livre" },
  { key: "amazon", label: "Amazon" },
  { key: "shopee", label: "Shopee" },
  { key: "droga_raia", label: "Droga Raia" },
];

const CANAL_LABEL = {
  mercado_livre: "Mercado Livre",
  amazon: "Amazon",
  shopee: "Shopee",
  droga_raia: "Droga Raia",
};

const CORES = {
  mercado_livre: "#facc15",
  amazon: "#fb923c",
  shopee: "#f43f5e",
  droga_raia: "#3b82f6",
};

let token = localStorage.getItem("token") || "";

let usuario = {
  nome: localStorage.getItem("nome") || "Usuário",
  perfil: localStorage.getItem("perfil") || "visualizador",
};

let produtos = [];
let produtoEditandoId = null;
let produtoDetalheId = null;
let produtoDetalheCanal = "todos";
let menuProdutoAbertoId = null;
let menuUsuarioAbertoId = null;
let detailChart = null;

let dashBusca = "";
let dashCanal = "todos";
let dashDias = 30;
let dashSort = "prioridade";
let dashData = null;

let histProdutoId = null;
let histDias = 30;
let histCanal = "todos";
let histTodos = [];
let histChart = null;

aplicarTemaSalvo();

if (token) {
  iniciarApp();
} else {
  showScreen("login");
}

document.getElementById("form-login").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("login-msg");
  limparMensagem(msg);

  try {
    const res = await fetch("/auth/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        email: document.getElementById("login-email").value.trim(),
        senha: document.getElementById("login-senha").value,
      }),
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      renderMensagem(msg, "error", data.detail || "Erro ao entrar");
      return;
    }

    token = data.token;

    usuario = {
      nome: data.nome || "Usuário",
      perfil: data.perfil || "visualizador",
    };

    localStorage.setItem("token", token);
    localStorage.setItem("nome", usuario.nome);
    localStorage.setItem("perfil", usuario.perfil);

    iniciarApp();
  } catch (err) {
    renderMensagem(msg, "error", "Erro de conexão");
  }
});

document.getElementById("form-register").addEventListener("submit", async (e) => {
  e.preventDefault();

  const msg = document.getElementById("register-msg");
  limparMensagem(msg);

  try {
    const res = await fetch("/auth/registrar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        nome: document.getElementById("reg-nome").value.trim(),
        email: document.getElementById("reg-email").value.trim(),
        senha: document.getElementById("reg-senha").value,
      }),
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      renderMensagem(msg, "error", data.detail || "Erro ao cadastrar");
      return;
    }

    if (data.token) {
      token = data.token;

      usuario = {
        nome: data.nome || "Usuário",
        perfil: data.perfil || "master",
      };

      localStorage.setItem("token", token);
      localStorage.setItem("nome", usuario.nome);
      localStorage.setItem("perfil", usuario.perfil);

      iniciarApp();
      return;
    }

    renderMensagem(msg, "success", data.mensagem || "Solicitação enviada.");
  } catch (err) {
    renderMensagem(msg, "error", "Erro de conexão");
  }
});

document.getElementById("busca-produtos").addEventListener("input", debounce(() => {
  carregarProdutos();
}, 250));

document.addEventListener("click", () => {
  if (menuProdutoAbertoId) {
    fecharMenusProduto();
  }

  if (menuUsuarioAbertoId) {
    fecharMenusUsuario();
  }
});

function podeGerenciarProdutos() {
  return usuario.perfil === "master" || usuario.perfil === "admin";
}

function podeGerenciarUsuarios() {
  return usuario.perfil === "master";
}

function showScreen(screen) {
  document.getElementById("screen-login").style.display = screen === "login" ? "flex" : "none";
  document.getElementById("screen-register").style.display = screen === "register" ? "flex" : "none";
  document.getElementById("screen-app").style.display = screen === "app" ? "flex" : "none";
}

async function iniciarApp() {
  showScreen("app");

  try {
    const res = await api("/auth/me");
    const me = await res.json();

    usuario.nome = me.nome || usuario.nome;
    usuario.perfil = me.perfil || usuario.perfil;

    localStorage.setItem("nome", usuario.nome);
    localStorage.setItem("perfil", usuario.perfil);
    localStorage.setItem("user_id", me.user_id || "");
  } catch (e) {}

  document.getElementById("user-name").textContent = usuario.nome;
  document.getElementById("user-role").textContent = usuario.perfil;
  document.getElementById("nav-usuarios").style.display = podeGerenciarUsuarios() ? "flex" : "none";

  setTab("dashboard");

  if (podeGerenciarUsuarios()) {
    carregarPendentes();
  }
}

function logout() {
  token = "";
  localStorage.removeItem("token");
  localStorage.removeItem("nome");
  localStorage.removeItem("perfil");
  localStorage.removeItem("user_id");
  showScreen("login");
}

async function api(path, opts = {}) {
  const headers = {
    ...(opts.headers || {}),
    "Authorization": `Bearer ${token}`,
  };

  if (opts.body && !headers["Content-Type"]) {
    headers["Content-Type"] = "application/json";
  }

  const res = await fetch(path, { ...opts, headers });

  if (res.status === 401) {
    logout();
    throw new Error("Não autenticado");
  }

  return res;
}

function setTab(tab) {
  if (tab === "usuarios" && !podeGerenciarUsuarios()) {
    tab = "dashboard";
  }

  document.querySelectorAll(".sidebar nav button").forEach(b => b.classList.remove("active"));

  const nav = document.getElementById(`nav-${tab}`);

  if (nav) {
    nav.classList.add("active");
  }

  const title = document.getElementById("page-title");
  const search = document.getElementById("top-search");

  if (detailChart) {
    detailChart.destroy();
    detailChart = null;
  }

  if (histChart) {
    histChart.destroy();
    histChart = null;
  }

  menuProdutoAbertoId = null;
  menuUsuarioAbertoId = null;
  produtoDetalheId = null;

  if (tab === "dashboard") {
    title.textContent = "Dashboard";
    search.style.display = "none";
    renderTelaDashboard();
  }

  if (tab === "produtos") {
    title.textContent = "Produtos";
    search.style.display = "block";
    renderTelaProdutos();
  }

  if (tab === "historico") {
    title.textContent = "Histórico";
    search.style.display = "none";
    renderTelaHistorico();
  }

  if (tab === "usuarios") {
    title.textContent = "Usuários";
    search.style.display = "none";
    renderTelaUsuarios();
  }
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("collapsed");
}

function toggleTheme() {
  const atual = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  aplicarTema(atual);
  localStorage.setItem("theme", atual);
}

function aplicarTemaSalvo() {
  aplicarTema(localStorage.getItem("theme") || "light");
}

function aplicarTema(theme) {
  document.documentElement.dataset.theme = theme;
  document.getElementById("theme-icon").textContent = theme === "dark" ? "☀" : "◐";
  document.getElementById("theme-label").textContent = theme === "dark" ? "Modo claro" : "Modo escuro";
}

/* ================= DASHBOARD ================= */

async function renderTelaDashboard() {
  const c = document.getElementById("content");

  c.innerHTML = `
    <div class="small-meta" id="dash-ultima-coleta">Última coleta: —</div>

    <div class="filters">
      <div class="field">
        <label>Buscar produto</label>
        <input type="text" id="dash-busca" placeholder="Nome, SKU ou EAN..." value="${escapeHtml(dashBusca)}" />
      </div>

      <div class="field">
        <label>Canal</label>
        <select id="dash-canal">
          <option value="todos">Todos</option>
          ${CANAIS.map(canal => `<option value="${canal.key}">${canal.label}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label>Período</label>
        <select id="dash-dias">
          <option value="7">7 dias</option>
          <option value="15">15 dias</option>
          <option value="30">30 dias</option>
          <option value="60">60 dias</option>
          <option value="90">90 dias</option>
        </select>
      </div>
    </div>

    <div class="stats" id="dash-cards">
      <div class="stat-card"><div class="label">Produtos</div><div class="value">...</div></div>
      <div class="stat-card"><div class="label">Registros</div><div class="value">...</div></div>
      <div class="stat-card"><div class="label">Ganhando</div><div class="value">...</div></div>
      <div class="stat-card"><div class="label">Acima do mercado</div><div class="value">...</div></div>
      <div class="stat-card"><div class="label">Muito acima</div><div class="value">...</div></div>
      <div class="stat-card"><div class="label">Gap médio</div><div class="value">...</div></div>
    </div>

    <div class="dashboard-grid">
      <div class="panel">
        <div class="panel-head">
          <h3>Ranking por e-commerce</h3>
        </div>
        <div class="panel-body" id="dash-ranking">
          <div class="empty">Carregando...</div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <h3>Status competitivo</h3>
        </div>
        <div class="table-scroll" style="max-height:520px;">
          <table>
            <thead>
              <tr>
                <th>Produto</th>
                <th>Canal</th>
                <th>Meu preço</th>
                <th>Menor preço no e-commerce</th>
                <th class="sortable" onclick="toggleDashSort()">Gap ${dashSort === "prioridade" ? "↓" : "↑"}</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="dash-status">
              <tr><td colspan="6" class="empty">Carregando...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  `;

  document.getElementById("dash-canal").value = dashCanal;
  document.getElementById("dash-dias").value = String(dashDias);

  document.getElementById("dash-busca").addEventListener("input", debounce((e) => {
    dashBusca = e.target.value.trim();
    carregarDashboard();
  }, 300));

  document.getElementById("dash-canal").addEventListener("change", (e) => {
    dashCanal = e.target.value || "todos";
    carregarDashboard();
  });

  document.getElementById("dash-dias").addEventListener("change", (e) => {
    dashDias = parseInt(e.target.value, 10);
    carregarDashboard();
  });

  await carregarDashboard();
}

async function carregarDashboard() {
  const params = new URLSearchParams();

  if (dashBusca) {
    params.set("busca", dashBusca);
  }

  if (dashCanal && dashCanal !== "todos") {
    params.set("canal", dashCanal);
  }

  params.set("dias", String(dashDias));

  try {
    const res = await api(`/dashboard?${params.toString()}`);
    dashData = await res.json();
  } catch (e) {
    dashData = null;
  }

  renderDashboardDados();
}

function renderDashboardDados() {
  if (!dashData) {
    document.getElementById("dash-cards").innerHTML = '<div class="empty">Erro ao carregar dashboard</div>';
    return;
  }

  document.getElementById("dash-ultima-coleta").textContent =
    `Última coleta: ${dashData.ultima_coleta ? formatData(dashData.ultima_coleta) : "—"}`;

  document.getElementById("dash-cards").innerHTML = `
    <div class="stat-card">
      <div class="label">Produtos</div>
      <div class="value">${dashData.total_produtos ?? 0}</div>
      <div class="sub">cadastrados</div>
    </div>

    <div class="stat-card">
      <div class="label">Registros</div>
      <div class="value">${dashData.total_registros ?? 0}</div>
      <div class="sub">coletas salvas</div>
    </div>

    <div class="stat-card">
      <div class="label">Ganhando</div>
      <div class="value">${formatPercent(dashData.percentual_ganhando)}</div>
      <div class="sub">preço menor ou igual</div>
    </div>

    <div class="stat-card">
      <div class="label">Acima do mercado</div>
      <div class="value">${dashData.acima_mercado ?? 0}</div>
      <div class="sub">gap acima de 3%</div>
    </div>

    <div class="stat-card">
      <div class="label">Muito acima</div>
      <div class="value">${dashData.muito_acima ?? 0}</div>
      <div class="sub">gap acima de 10%</div>
    </div>

    <div class="stat-card">
      <div class="label">Gap médio</div>
      <div class="value">${dashData.gap_medio == null ? "—" : formatSignedPercent(dashData.gap_medio)}</div>
      <div class="sub">vs menor preço</div>
    </div>
  `;

  renderRankingEcommerce();
  renderStatusCompetitivo();
}

function renderRankingEcommerce() {
  const cont = document.getElementById("dash-ranking");
  const ranking = dashData.ranking_ecommerce || [];

  if (ranking.length === 0 || ranking.every(x => !x.vitorias)) {
    cont.innerHTML = '<div class="empty">Sem dados suficientes no período</div>';
    return;
  }

  cont.innerHTML = ranking.map(item => `
    <div class="ranking-row">
      <div>${escapeHtml(CANAL_LABEL[item.canal] || item.canal)}</div>
      <div class="ranking-bar">
        <div class="ranking-fill" style="width:${Math.max(0, Math.min(100, item.percentual || 0))}%"></div>
      </div>
      <div>${formatPercent(item.percentual)}</div>
    </div>
  `).join("");
}

function renderStatusCompetitivo() {
  const tb = document.getElementById("dash-status");
  let lista = [...(dashData.status_competitivo || [])];

  lista.sort((a, b) => {
    if (dashSort === "prioridade") {
      return b.gap - a.gap;
    }
    return a.gap - b.gap;
  });

  if (lista.length === 0) {
    tb.innerHTML = '<tr><td colspan="6" class="empty">Sem comparações com dados suficientes</td></tr>';
    return;
  }

  tb.innerHTML = lista.map(item => `
    <tr>
      <td><strong>${escapeHtml(item.produto)}</strong></td>
      <td>${escapeHtml(CANAL_LABEL[item.canal] || item.canal)}</td>
      <td>${formatBRL(item.meu_preco)}</td>
      <td>${formatBRL(item.menor_preco)}</td>
      <td>${formatSignedPercent(item.gap)}</td>
      <td>${statusBadge(item.status)}</td>
    </tr>
  `).join("");
}

async function carregarDadosDetalheProduto() {
  const produto = produtos.find(p => p.id === produtoDetalheId);
  const body = document.getElementById("produto-detalhe-body");

  if (!produto || !body) {
    return;
  }

  const canalHistorico = produtoDetalheCanal !== "todos" ? `&canal=${produtoDetalheCanal}` : "";
  const canalCanais = produtoDetalheCanal !== "todos" ? `?canal=${produtoDetalheCanal}` : "";

  let canais = {};
  let historico = [];

  try {
    const [r1, r2] = await Promise.all([
      api(`/produtos/${produto.id}/canais${canalCanais}`),
      api(`/produtos/${produto.id}/historico?dias=30${canalHistorico}`),
    ]);

    canais = await r1.json();
    historico = await r2.json();
  } catch (err) {}

  const pp = produto.precos_praticados || {};

  const canaisVisiveis = produtoDetalheCanal === "todos"
    ? CANAIS
    : CANAIS.filter(c => c.key === produtoDetalheCanal);

  body.innerHTML = `
    <div class="channels-table-wrap">
      <table>
        <thead>
          <tr>
            <th>E-commerce</th>
            <th>Meu preço</th>
            <th>Menor preço no e-commerce</th>
            <th>Variação média 7d</th>
            <th>Coletas 7d</th>
          </tr>
        </thead>

        <tbody>
          ${canaisVisiveis.map(c => {
            const dados = canais[c.key] || {};

            return `
              <tr>
                <td><strong>${c.label}</strong></td>
                <td>${pp[c.key] != null ? formatBRL(pp[c.key]) : "—"}</td>
                <td>${dados.menor_preco_atual != null ? formatBRL(dados.menor_preco_atual) : "—"}</td>
                <td>${formatVariacao(dados.variacao_media_7d)}</td>
                <td>${dados.registros || 0}</td>
              </tr>
            `;
          }).join("")}
        </tbody>
      </table>
    </div>

    <div class="chart-wrap" id="detail-chart-wrap">
      <canvas id="detail-chart"></canvas>
    </div>
  `;

  desenharGraficoDetalhe(historico);
}

function desenharGraficoDetalhe(historico) {
  const ctx = document.getElementById("detail-chart");

  if (!ctx) {
    return;
  }

  if (detailChart) {
    detailChart.destroy();
    detailChart = null;
  }

  const labels = Array.from(new Set(historico.map(h => h.data))).sort();
  const labelsFormat = labels.map(formatData);

  const canaisGrafico = produtoDetalheCanal === "todos"
    ? CANAIS
    : CANAIS.filter(c => c.key === produtoDetalheCanal);

  const datasets = canaisGrafico.map(c => {
    const data = labels.map(label => {
      const item = historico.find(h => h.data === label && h.canal === c.key);
      return item ? item.preco : null;
    });

    return {
      label: c.label,
      data,
      borderColor: CORES[c.key],
      backgroundColor: CORES[c.key] + "30",
      tension: 0.3,
      spanGaps: true,
    };
  }).filter(ds => ds.data.some(v => v != null));

  if (datasets.length === 0) {
    document.getElementById("detail-chart-wrap").innerHTML =
      '<div class="empty">Sem histórico para este filtro.</div>';
    return;
  }

  detailChart = new Chart(ctx, {
    type: "line",
    data: { labels: labelsFormat, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: {
        x: { ticks: { maxTicksLimit: 8 } },
        y: { ticks: { callback: v => "R$ " + Number(v).toFixed(2) } },
      },
    },
  });
}

async function salvarProduto() {
  const alert = document.getElementById("modal-alert");
  limparMensagem(alert);

  const nome = document.getElementById("p-nome").value.trim();
  const sku = document.getElementById("p-sku").value.trim();
  const ean = document.getElementById("p-ean").value.trim();
  const pc1 = document.getElementById("p-pc1").value.trim();
  const pc2 = document.getElementById("p-pc2").value.trim();

  if (!nome || !sku || !ean || !pc1) {
    renderMensagem(alert, "error", "Preencha nome, SKU, EAN e palavra-chave 1.", "alert");
    return;
  }

  const payload = {
    nome,
    sku,
    ean,
    palavra_chave_1: pc1,
    palavra_chave_2: pc2,
    precos_praticados: {
      mercado_livre: parseNum(document.getElementById("p-pp-ml").value),
      amazon: parseNum(document.getElementById("p-pp-am").value),
      shopee: parseNum(document.getElementById("p-pp-sh").value),
      droga_raia: parseNum(document.getElementById("p-pp-dr").value),
    },
  };

  const url = produtoEditandoId ? `/produtos/${produtoEditandoId}` : "/produtos";
  const method = produtoEditandoId ? "PUT" : "POST";

  try {
    const res = await api(url, {
      method,
      body: JSON.stringify(payload),
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      renderMensagem(alert, "error", data.detail || "Erro ao salvar", "alert");
      return;
    }

    document.getElementById("modal-form").style.display = "none";
    document.getElementById("modal-actions").style.display = "none";
    document.getElementById("modal-success").style.display = "block";
    renderMensagem(
      document.getElementById("modal-success"),
      "success",
      data.mensagem || "Produto salvo com sucesso!",
      "alert",
    );
    document.getElementById("modal-success-actions").style.display = "flex";

    await carregarProdutos();

    if (produtoDetalheId) {
      const atualizado = produtos.find(p => p.id === produtoDetalheId);

      if (atualizado) {
        await renderDetalheProduto();
      }
    }
  } catch (err) {
    renderMensagem(alert, "error", "Erro de conexão", "alert");
  }
}

async function excluirProduto(id) {
  menuProdutoAbertoId = null;

  if (!confirm("Tem certeza que deseja excluir este produto e todo o histórico?")) {
    return;
  }

  try {
    const res = await api(`/produtos/${id}`, { method: "DELETE" });

    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      alert(d.detail || "Erro ao excluir");
      return;
    }

    produtoDetalheId = null;
    await renderTelaProdutos();
  } catch (err) {
    alert("Erro de conexão");
  }
}

async function renderTelaHistorico() {
  try {

  } catch (err) {

  }

  const c = document.getElementById("content");

        <input type="text" id="hist-busca" placeholder="Nome, SKU ou EAN..." />

      </div>

      <div class="field">
        <label>Canal</label>
        <select id="hist-canal">
          <option value="todos">Todos</option>
          ${CANAIS.map(c => `<option value="${c.key}">${c.label}</option>`).join("")}
        </select>
      </div>

      <div class="field">
        <label>Período</label>
        <div class="periodo-grupo" id="hist-periodos">
          <button class="periodo-btn" data-dias="7">7d</button>
          <button class="periodo-btn" data-dias="15">15d</button>
          <button class="periodo-btn active" data-dias="30">30d</button>
          <button class="periodo-btn" data-dias="60">60d</button>
          <button class="periodo-btn" data-dias="90">90d</button>
        </div>
      </div>
    </div>

    <div class="hist-chart-wrap" id="hist-chart-wrap">
      <canvas id="hist-chart"></canvas>
    </div>
  `;

  preencherSelectHistorico("");

  document.getElementById("hist-busca").addEventListener("input", (e) => {
    preencherSelectHistorico(e.target.value.trim());
  });

  document.getElementById("hist-produto").addEventListener("change", (e) => {
    histProdutoId = e.target.value || null;
    carregarHistorico();
  });

  document.getElementById("hist-canal").addEventListener("change", (e) => {
    histCanal = e.target.value || "todos";
    carregarHistorico();
  });

  document.getElementById("hist-periodos").addEventListener("click", (e) => {
    const b = e.target.closest("button.periodo-btn");

    if (!b) {
      return;
    }

    document.querySelectorAll("#hist-periodos .periodo-btn").forEach(x => x.classList.remove("active"));
    b.classList.add("active");

    histDias = parseInt(b.dataset.dias, 10);
    carregarHistorico();
  });

  if (histProdutoId) {
    document.getElementById("hist-produto").value = histProdutoId;
    document.getElementById("hist-canal").value = histCanal;
    carregarHistorico();
  }
}

function preencherSelectHistorico(busca) {
  const sel = document.getElementById("hist-produto");

  if (!sel) {
    return;
  }

  const termo = (busca || "").toLowerCase();

  const filtrados = histTodos.filter(p => {
    if (!termo) {
      return true;
    }

    return (p.nome || "").toLowerCase().includes(termo)
      || (p.sku || "").toLowerCase().includes(termo)
      || (p.ean || "").toLowerCase().includes(termo);
  });

  sel.innerHTML = `<option value="">— escolha um produto —</option>` +
    filtrados.map(p => `<option value="${p.id}">${escapeHtml(p.nome)} (SKU ${escapeHtml(p.sku || "—")})</option>`).join("");

  if (histProdutoId && filtrados.find(p => p.id === histProdutoId)) {
    sel.value = histProdutoId;
  } else {
    histProdutoId = null;
  }
}

async function carregarHistorico() {
  const wrap = document.getElementById("hist-chart-wrap");

  if (!histProdutoId) {
    if (wrap) {
      wrap.innerHTML = '<div class="empty">Selecione um produto para visualizar o histórico.</div>';
    }

    if (histChart) {
      histChart.destroy();
      histChart = null;
    }

    return;
  }

  let historico = [];

  try {
    const canalQuery = histCanal !== "todos" ? `&canal=${histCanal}` : "";
    const res = await api(`/produtos/${histProdutoId}/historico?dias=${histDias}${canalQuery}`);
    historico = await res.json();
  } catch (err) {
    historico = [];
  }

  desenharGraficoHistorico(historico);
}

function desenharGraficoHistorico(historico) {
  const wrap = document.getElementById("hist-chart-wrap");

  if (!wrap) {
    return;
  }

  wrap.innerHTML = '<canvas id="hist-chart"></canvas>';
  const ctx = document.getElementById("hist-chart");

  if (histChart) {
    histChart.destroy();
    histChart = null;
  }

  const labels = Array.from(new Set(historico.map(h => h.data))).sort();
  const labelsFormat = labels.map(formatData);

  const canaisGrafico = histCanal === "todos"
    ? CANAIS
    : CANAIS.filter(c => c.key === histCanal);

  const datasets = canaisGrafico.map(c => {
    const data = labels.map(label => {
      const item = historico.find(h => h.data === label && h.canal === c.key);
      return item ? item.preco : null;
    });

    return {
      label: c.label,
      data,
      borderColor: CORES[c.key],
      backgroundColor: CORES[c.key] + "30",
      tension: 0.3,
      spanGaps: true,
    };
  }).filter(ds => ds.data.some(v => v != null));

  if (datasets.length === 0) {
    wrap.innerHTML = '<div class="empty">Sem histórico para os filtros selecionados.</div>';
    return;
  }

  histChart = new Chart(ctx, {
    type: "line",
    data: { labels: labelsFormat, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "bottom" } },
      scales: {
        x: { ticks: { maxTicksLimit: 10 } },
        y: { ticks: { callback: v => "R$ " + Number(v).toFixed(2) } },
      },
    },
  });
}

}

async function carregarPendentes() {
  if (!podeGerenciarUsuarios()) {
    return;
  }

  try {
    const res = await api("/pendentes");
    const lista = await res.json();

    const badge = document.getElementById("badge-pendentes");

    if (badge) {
      if (lista.length > 0) {
        badge.textContent = lista.length;
        badge.style.display = "inline-block";
      } else {
        badge.style.display = "none";
      }
    }

    const cont = document.getElementById("tbody-pendentes");

    if (!cont) {
      return;
    }

    if (lista.length === 0) {
      cont.innerHTML = '<div class="empty">Nenhuma solicitação pendente</div>';
      return;
    }

    cont.innerHTML = lista.map(u => `
      <div class="user-row">
        <div class="info">
          <div class="name">${escapeHtml(u.nome)}</div>
          <div class="email">${escapeHtml(u.email)}</div>
        </div>

        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <select id="perfil-pendente-${u.id}">
            <option value="visualizador">Visualizador</option>
            <option value="admin">Admin</option>
            <option value="master">Master</option>
          </select>

          <button class="btn-edit" onclick="aprovarUsuarioSelecionado('${u.id}')">Aprovar</button>
          <button class="btn-danger" onclick="rejeitarUsuario('${u.id}')">Rejeitar</button>
        </div>
      </div>
    `).join("");
  } catch (err) {}
}

async function carregarUsuarios() {
  if (!podeGerenciarUsuarios()) {
    return;
  }

  try {
    const res = await api("/usuarios");
    const lista = await res.json();

    const cont = document.getElementById("tbody-usuarios");

    if (!cont) {
      return;
    }

    if (lista.length === 0) {
      cont.innerHTML = '<div class="empty">Nenhum usuário cadastrado</div>';
      return;
    }

    cont.innerHTML = lista.map(u => `
      <div class="user-row">
        <div class="info">
          <div class="name">${escapeHtml(u.nome)}</div>
          <div class="email">${escapeHtml(u.email)}</div>
        </div>

        <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
          <select onchange="alterarPerfilUsuario('${u.id}', this.value)">
            <option value="master" ${u.perfil === "master" ? "selected" : ""}>Master</option>
            <option value="admin" ${u.perfil === "admin" ? "selected" : ""}>Admin</option>
            <option value="visualizador" ${u.perfil === "visualizador" ? "selected" : ""}>Visualizador</option>
          </select>

          <span class="badge ${u.perfil === "master" ? "master" : u.perfil === "admin" ? "admin" : "viewer"}">
            ${escapeHtml(u.perfil || "visualizador")}
          </span>

          <span class="badge ${u.status === "aprovado" ? "approved" : u.status === "pendente" ? "pending" : "rejected"}">
            ${escapeHtml(u.status || "aprovado")}
          </span>

          <div class="actions-cell" onclick="event.stopPropagation();">
            <button class="kebab-btn" onclick="toggleMenuUsuario(event, '${u.id}')">⋯</button>

            <div class="action-menu ${menuUsuarioAbertoId === u.id ? "show" : ""}">
              <button onclick="rejeitarUsuario('${u.id}')">Rejeitar</button>
              <button class="danger" onclick="excluirUsuario('${u.id}')">Excluir</button>
            </div>
          </div>
        </div>
      </div>
    `).join("");
  } catch (err) {}
}

function toggleMenuUsuario(event, id) {
  event.stopPropagation();
  menuUsuarioAbertoId = menuUsuarioAbertoId === id ? null : id;
  carregarUsuarios();
}

function fecharMenusUsuario() {
  menuUsuarioAbertoId = null;

  if (document.getElementById("tbody-usuarios")) {
    carregarUsuarios();
  }
}

async function aprovarUsuarioSelecionado(id) {
  const perfil = document.getElementById(`perfil-pendente-${id}`)?.value || "visualizador";

  try {
    const res = await api(`/aprovar/${id}?perfil=${perfil}`, {
      method: "POST",
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      alert(data.detail || "Erro ao aprovar usuário");
      return;
    }

    await carregarPendentes();
    await carregarUsuarios();
  } catch (e) {
    alert("Erro de conexão");
  }
}

async function alterarPerfilUsuario(id, perfil) {
  try {
    const res = await api(`/usuarios/${id}/perfil?perfil=${perfil}`, {
      method: "PUT",
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      alert(data.detail || "Erro ao alterar função");
      await carregarUsuarios();
      return;
    }

    await carregarUsuarios();

    if (id === localStorage.getItem("user_id")) {
      usuario.perfil = perfil;
      localStorage.setItem("perfil", perfil);
      iniciarApp();
    }
  } catch (e) {
    alert("Erro de conexão");
  }
}

async function rejeitarUsuario(id) {
  try {
    const res = await api(`/rejeitar/${id}`, {
      method: "POST",
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      alert(data.detail || "Erro ao rejeitar usuário");
      return;
    }

    await carregarPendentes();
    await carregarUsuarios();
  } catch (e) {
    alert("Erro de conexão");
  }
}

async function excluirUsuario(id) {
  if (!confirm("Tem certeza que deseja excluir este usuário?")) {
    return;
  }

  try {
    const res = await api(`/usuarios/${id}`, {
      method: "DELETE",
    });

    const data = await res.json().catch(() => ({}));

    if (!res.ok) {
      alert(data.detail || "Erro ao excluir usuário");
      return;
    }

    await carregarPendentes();
    await carregarUsuarios();
  } catch (e) {
    alert("Erro de conexão");
  }
}

/* ================= HELPERS ================= */

function formatBRL(v) {
  if (v == null || v === "") {
    return "—";
  }

  const n = Number(v);

  if (Number.isNaN(n)) {
    return "—";
  }

  return n.toLocaleString("pt-BR", {
    style: "currency",
    currency: "BRL",
  });
}

function formatPercent(v) {
  if (v == null || Number.isNaN(Number(v))) {
    return "0%";
  }

  return `${Number(v).toFixed(1)}%`;
}

function formatSignedPercent(v) {
  if (v == null || Number.isNaN(Number(v))) {
    return "—";
  }

  const n = Number(v);
  const sinal = n > 0 ? "+" : "";

  return `${sinal}${n.toFixed(1)}%`;
}

function formatVariacao(v) {
  if (v == null || Number.isNaN(Number(v))) {
    return '<span class="variation-zero">—</span>';
  }

  const n = Number(v);

  if (n > 0) {
    return `<span class="variation-up">▲ ${n.toFixed(2)}%</span>`;
  }

  if (n < 0) {
    return `<span class="variation-down">▼ ${Math.abs(n).toFixed(2)}%</span>`;
  }

  return '<span class="variation-zero">0,00%</span>';
}

function statusBadge(status) {
  const s = status || "";

  if (s === "Ganhando") {
    return '<span class="status-badge status-ganhando">Ganhando</span>';
  }

  if (s === "Competitivo") {
    return '<span class="status-badge status-competitivo">Competitivo</span>';
  }

  if (s === "Acima") {
    return '<span class="status-badge status-acima">Acima</span>';
  }

  if (s === "Muito acima") {
    return '<span class="status-badge status-muito-acima">Muito acima</span>';
  }

  return `<span class="status-badge">${escapeHtml(s || "—")}</span>`;
}

function formatData(value) {
  if (!value) {
    return "—";
  }

  const d = new Date(value);

  if (Number.isNaN(d.getTime())) {
    return "—";
  }

  return d.toLocaleDateString("pt-BR") + " " + d.toLocaleTimeString("pt-BR", {
    hour: "2-digit",
    minute: "2-digit",
  });
}

function parseNum(v) {
  if (v === "" || v == null) {
    return null;
  }

  const n = parseFloat(String(v).replace(",", "."));

  return Number.isNaN(n) ? null : n;
}

function limparMensagem(container) {
  if (!container) {
    return;
  }

  container.textContent = "";
}

function renderMensagem(container, tipo, texto, classeBase = "msg") {
  if (!container) {
    return;
  }

  container.textContent = "";

  const el = document.createElement("div");
  el.className = `${classeBase} ${tipo}`;
  el.textContent = texto || "";
  container.appendChild(el);
}

function escapeHtml(s) {
  if (s == null) {
    return "";
  }

  return String(s)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function debounce(fn, delay) {
  let t;

  return (...args) => {
    clearTimeout(t);
    t = setTimeout(() => fn(...args), delay);
  };
}
